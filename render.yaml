services:
  - type: web
    name: uptimeguard-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uptimeguard-db
          property: connectionString
databases:
  - name: uptimeguard-db
    plan: basic-256mb
